name: DocMorph Cloud Compilation

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: Cloud Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install System Dependencies
        run: sudo apt-get update && sudo apt-get install -y gperf

      - name: Install Rust & cargo-ndk
        run: |
          rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android i686-linux-android
          cargo install cargo-ndk --locked

      - name: Setup Tectonic TeX Bundle
        run: |
          mkdir -p app/src/main/assets/tectonic-bundle
          echo "Extracting vendored Tectonic TeX Live bundle..."
          cp vendor_tars/tlextras-2021.3r1.tar app/src/main/assets/tectonic-bundle/default.ttb

      - name: Build Static Dependencies for Android NDK
        run: |
          set -euo pipefail

          # Mask the host's icu-config
          mkdir -p $GITHUB_WORKSPACE/bin-override
          cat << 'EOSH' > $GITHUB_WORKSPACE/bin-override/icu-config
          #!/bin/sh
          exit 1
          EOSH
          chmod +x $GITHUB_WORKSPACE/bin-override/icu-config
          export PATH="$GITHUB_WORKSPACE/bin-override:$PATH"

          echo "Extracting vendored C++ tarballs..."
          cp vendor_tars/zlib-1.2.13.tar.gz . && tar xf zlib-1.2.13.tar.gz
          cp vendor_tars/libpng-1.6.40.tar.gz . && tar xf libpng-1.6.40.tar.gz
          cp vendor_tars/graphite2-1.3.14.tgz . && tar xf graphite2-1.3.14.tgz
          cp vendor_tars/freetype-2.13.2.tar.gz . && tar xf freetype-2.13.2.tar.gz
          cp vendor_tars/harfbuzz-8.3.0.tar.xz . && tar xf harfbuzz-8.3.0.tar.xz
          cp vendor_tars/expat-2.5.0.tar.gz . && tar xf expat-2.5.0.tar.gz
          cp vendor_tars/fontconfig-2.14.2.tar.gz . && tar xf fontconfig-2.14.2.tar.gz
          cp vendor_tars/icu4c-73_2-src.tgz . && tar xf icu4c-73_2-src.tgz

          export NDK=${ANDROID_NDK_HOME:-${ANDROID_NDK_LATEST_HOME:-}}
          echo "Using NDK at: $NDK"
          export TOOLCHAIN=$NDK/toolchains/llvm/prebuilt/linux-x86_64
          export API=24

          echo "Building ICU Host Tools..."
          mkdir -p icu-host && cd icu-host
          ../icu/source/runConfigureICU Linux --enable-static --disable-shared
          make -j4
          cd ..

          declare -A ABI_MAP=(
            [aarch64-linux-android]=arm64-v8a
            [armv7a-linux-androideabi]=armeabi-v7a
            [x86_64-linux-android]=x86_64
            [i686-linux-android]=x86
          )

          for arch in aarch64-linux-android armv7a-linux-androideabi x86_64-linux-android i686-linux-android; do
            abi=${ABI_MAP[$arch]}
            export CC=$TOOLCHAIN/bin/${arch}${API}-clang
            export CXX=$TOOLCHAIN/bin/${arch}${API}-clang++
            export AR=$TOOLCHAIN/bin/llvm-ar
            export RANLIB=$TOOLCHAIN/bin/llvm-ranlib

            mkdir -p zlib-build-$arch && cd zlib-build-$arch
            ../zlib-1.2.13/configure --prefix=$GITHUB_WORKSPACE/deps/$arch --static
            make -j4 install
            cd ..

            mkdir -p png-build-$arch && cd png-build-$arch
            export CPPFLAGS="-I$GITHUB_WORKSPACE/deps/$arch/include"
            export LDFLAGS="-L$GITHUB_WORKSPACE/deps/$arch/lib"
            ../libpng-1.6.40/configure --host=$arch --prefix=$GITHUB_WORKSPACE/deps/$arch CC=$CC AR=$AR RANLIB=$RANLIB --disable-shared --enable-static
            make -j4 install
            cd ..

            mkdir -p graphite2-build-$arch && cd graphite2-build-$arch
            cmake ../graphite2-1.3.14 -DCMAKE_TOOLCHAIN_FILE=$NDK/build/cmake/android.toolchain.cmake -DANDROID_ABI=$abi -DANDROID_PLATFORM=android-$API -DCMAKE_INSTALL_PREFIX=$GITHUB_WORKSPACE/deps/$arch -DCMAKE_PREFIX_PATH=$GITHUB_WORKSPACE/deps/$arch -DBUILD_SHARED_LIBS=OFF -DCMAKE_POSITION_INDEPENDENT_CODE=ON
            cmake --build . -j4
            cmake --install .
            cd ..

            mkdir -p freetype-build-$arch && cd freetype-build-$arch
            ../freetype-2.13.2/configure --host=$arch --prefix=$GITHUB_WORKSPACE/deps/$arch CC=$CC AR=$AR RANLIB=$RANLIB --disable-shared --enable-static
            make -j4 install
            cd ..

            mkdir -p hb-build-$arch && cd hb-build-$arch
            cmake ../harfbuzz-8.3.0 -DCMAKE_TOOLCHAIN_FILE=$NDK/build/cmake/android.toolchain.cmake -DANDROID_ABI=$abi -DANDROID_PLATFORM=android-$API -DCMAKE_INSTALL_PREFIX=$GITHUB_WORKSPACE/deps/$arch -DCMAKE_PREFIX_PATH=$GITHUB_WORKSPACE/deps/$arch -DBUILD_SHARED_LIBS=OFF -Dharfbuzz_with_cairo=OFF -Dharfbuzz_with_chafa=OFF -Dharfbuzz_with_glib=OFF -Dharfbuzz_with_gobject=OFF -Dharfbuzz_with_icu=OFF -Dharfbuzz_with_tests=OFF -Dharfbuzz_with_utilities=OFF
            cmake --build . -j4
            cmake --install .
            cd ..

            mkdir -p expat-build-$arch && cd expat-build-$arch
            ../expat-2.5.0/configure --host=$arch --prefix=$GITHUB_WORKSPACE/deps/$arch --enable-static --disable-shared
            make -j4 install
            cd ..

            mkdir -p fontconfig-build-$arch && cd fontconfig-build-$arch
            export EXPAT_CFLAGS="-I$GITHUB_WORKSPACE/deps/$arch/include"
            export EXPAT_LIBS="-L$GITHUB_WORKSPACE/deps/$arch/lib -lexpat"
            export FREETYPE_CFLAGS="-I$GITHUB_WORKSPACE/deps/$arch/include/freetype2"
            export FREETYPE_LIBS="-L$GITHUB_WORKSPACE/deps/$arch/lib -lfreetype"
            ../fontconfig-2.14.2/configure --host=$arch --prefix=$GITHUB_WORKSPACE/deps/$arch --enable-static --disable-shared --disable-docs --with-expat=$GITHUB_WORKSPACE/deps/$arch
            make -j4 install
            cd ..

            echo "Building Target ICU for $arch..."
            mkdir -p icu-build-$arch && cd icu-build-$arch
            export CFLAGS="-fPIC"
            export CXXFLAGS="-fPIC -std=c++14"
            ../icu/source/configure --host=$arch --prefix=$GITHUB_WORKSPACE/deps/$arch --enable-static --disable-shared --with-data-packaging=static --with-cross-build=$GITHUB_WORKSPACE/icu-host
            make -j4 install
            cd ..

            PKG_DIR="$GITHUB_WORKSPACE/deps/$arch/lib/pkgconfig"
            mkdir -p "$PKG_DIR"

            for lib in zlib libpng freetype2 graphite2 harfbuzz expat fontconfig icu-uc icu-i18n icu-io; do
                echo "prefix=$GITHUB_WORKSPACE/deps/$arch" > "$PKG_DIR/$lib.pc"
                echo "exec_prefix=\${prefix}" >> "$PKG_DIR/$lib.pc"
                echo "libdir=\${exec_prefix}/lib" >> "$PKG_DIR/$lib.pc"
                echo "includedir=\${prefix}/include" >> "$PKG_DIR/$lib.pc"
                echo "Name: $lib" >> "$PKG_DIR/$lib.pc"
                echo "Description: $lib" >> "$PKG_DIR/$lib.pc"
                echo "Version: 1.0" >> "$PKG_DIR/$lib.pc"
            done
            
            echo "Libs: -L\${libdir} -lz" >> "$PKG_DIR/zlib.pc"
            echo "Cflags: -I\${includedir}" >> "$PKG_DIR/zlib.pc"
            
            echo "Libs: -L\${libdir} -lpng16 -lz" >> "$PKG_DIR/libpng.pc"
            echo "Cflags: -I\${includedir}" >> "$PKG_DIR/libpng.pc"
            
            echo "Libs: -L\${libdir} -lfreetype" >> "$PKG_DIR/freetype2.pc"
            echo "Cflags: -I\${includedir}/freetype2" >> "$PKG_DIR/freetype2.pc"
            
            echo "Libs: -L\${libdir} -lgraphite2 -lstdc++" >> "$PKG_DIR/graphite2.pc"
            echo "Cflags: -I\${includedir}" >> "$PKG_DIR/graphite2.pc"
            
            echo "Libs: -L\${libdir} -lharfbuzz" >> "$PKG_DIR/harfbuzz.pc"
            echo "Cflags: -I\${includedir}/harfbuzz" >> "$PKG_DIR/harfbuzz.pc"
            
            echo "Libs: -L\${libdir} -lexpat" >> "$PKG_DIR/expat.pc"
            echo "Cflags: -I\${includedir}" >> "$PKG_DIR/expat.pc"
            
            echo "Libs: -L\${libdir} -lfontconfig -lexpat -lfreetype -lpng16 -lz -lm" >> "$PKG_DIR/fontconfig.pc"
            echo "Cflags: -I\${includedir}" >> "$PKG_DIR/fontconfig.pc"
            
            echo "Libs: -L\${libdir} -licuuc -licudata -lm -lstdc++" >> "$PKG_DIR/icu-uc.pc"
            echo "Cflags: -I\${includedir}" >> "$PKG_DIR/icu-uc.pc"
            
            echo "Libs: -L\${libdir} -licui18n -licuuc -licudata -lm -lstdc++" >> "$PKG_DIR/icu-i18n.pc"
            echo "Cflags: -I\${includedir}" >> "$PKG_DIR/icu-i18n.pc"
            
            echo "Libs: -L\${libdir} -licuio -licui18n -licuuc -licudata -lm -lstdc++" >> "$PKG_DIR/icu-io.pc"
            echo "Cflags: -I\${includedir}" >> "$PKG_DIR/icu-io.pc"
          done

      - name: Build Tectonic JNI (Rust)
        env:
          CARGO_BUILD_JOBS: "2"
          PKG_CONFIG_ALLOW_CROSS: "1"
          TECTONIC_DEP_BACKEND: "pkg-config"
          
          PKG_CONFIG_PATH_aarch64_linux_android: "${{ github.workspace }}/deps/aarch64-linux-android/lib/pkgconfig"
          PKG_CONFIG_LIBDIR_aarch64_linux_android: "${{ github.workspace }}/deps/aarch64-linux-android/lib/pkgconfig"
          PKG_CONFIG_SYSROOT_DIR_aarch64_linux_android: "${{ github.workspace }}/deps/aarch64-linux-android"

          PKG_CONFIG_PATH_armv7_linux_androideabi: "${{ github.workspace }}/deps/armv7a-linux-androideabi/lib/pkgconfig"
          PKG_CONFIG_LIBDIR_armv7_linux_androideabi: "${{ github.workspace }}/deps/armv7a-linux-androideabi/lib/pkgconfig"
          PKG_CONFIG_SYSROOT_DIR_armv7_linux_androideabi: "${{ github.workspace }}/deps/armv7a-linux-androideabi"

          PKG_CONFIG_PATH_x86_64_linux_android: "${{ github.workspace }}/deps/x86_64-linux-android/lib/pkgconfig"
          PKG_CONFIG_LIBDIR_x86_64_linux_android: "${{ github.workspace }}/deps/x86_64-linux-android/lib/pkgconfig"
          PKG_CONFIG_SYSROOT_DIR_x86_64_linux_android: "${{ github.workspace }}/deps/x86_64-linux-android"

          PKG_CONFIG_PATH_i686_linux_android: "${{ github.workspace }}/deps/i686-linux-android/lib/pkgconfig"
          PKG_CONFIG_LIBDIR_i686_linux_android: "${{ github.workspace }}/deps/i686-linux-android/lib/pkgconfig"
          PKG_CONFIG_SYSROOT_DIR_i686_linux_android: "${{ github.workspace }}/deps/i686-linux-android"
        run: |
          sudo rm -rf /usr/lib/pkgconfig /usr/share/pkgconfig /usr/lib/x86_64-linux-gnu/pkgconfig
          export PATH="$GITHUB_WORKSPACE/bin-override:$PATH"
          cd app/src/main/rust/tectonic-jni
          cargo ndk -t arm64-v8a -t armeabi-v7a -t x86_64 -t x86 -o ../../../jniLibs build --release

      - name: Generate Gradle Wrapper (Cloud Execution)
        run: gradle wrapper

      - name: Generate Debug Keystore Dynamically
        run: |
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "C=US, O=Android, CN=Android Debug"

      - name: Grant Execute Permissions
        run: chmod +x gradlew

      - name: Assemble Debug APK with Gradle
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload DocMorph APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DocMorph-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
