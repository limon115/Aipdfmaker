name: DocMorph Cloud Compilation

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: Cloud Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Install Rust & cargo-ndk
        run: |
          rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android i686-linux-android
          cargo install cargo-ndk

      - name: Download Tectonic TeX Bundle
        run: |
          mkdir -p app/src/main/assets/tectonic-bundle
          echo "Downloading Tectonic TeX Live bundle..."
          curl -L -o app/src/main/assets/tectonic-bundle/default.ttb "https://github.com/tectonic-typesetting/tectonic-texlive-bundles/releases/download/tlextras-2021.3r1/tlextras-2021.3r1.tar"

      - name: Build Static Dependencies for Android NDK
        run: |
          # 1. Reliable Downloads
          curl -L -o zlib-1.2.13.tar.gz https://github.com/madler/zlib/releases/download/v1.2.13/zlib-1.2.13.tar.gz
          tar xf zlib-1.2.13.tar.gz
          curl -L -o libpng-1.6.40.tar.gz https://download.sourceforge.net/project/libpng/libpng16/1.6.40/libpng-1.6.40.tar.gz
          tar xf libpng-1.6.40.tar.gz
          curl -L -o graphite2-1.3.14.tgz https://github.com/silnrsi/graphite/releases/download/1.3.14/graphite2-1.3.14.tgz
          tar xf graphite2-1.3.14.tgz
          curl -L -o freetype-2.13.2.tar.gz https://download.savannah.gnu.org/releases/freetype/freetype-2.13.2.tar.gz
          tar xf freetype-2.13.2.tar.gz
          curl -L -o harfbuzz-8.3.0.tar.xz https://github.com/harfbuzz/harfbuzz/releases/download/8.3.0/harfbuzz-8.3.0.tar.xz
          tar xf harfbuzz-8.3.0.tar.xz

          export NDK=$ANDROID_NDK_HOME
          export TOOLCHAIN=$NDK/toolchains/llvm/prebuilt/linux-x86_64
          export API=24

          declare -A ABI_MAP=(
            [aarch64-linux-android]=arm64-v8a
            [armv7a-linux-androideabi]=armeabi-v7a
            [x86_64-linux-android]=x86_64
            [i686-linux-android]=x86
          )

          for arch in aarch64-linux-android armv7a-linux-androideabi x86_64-linux-android i686-linux-android; do
            abi=${ABI_MAP[$arch]}
            export CC=$TOOLCHAIN/bin/${arch}${API}-clang
            export CXX=$TOOLCHAIN/bin/${arch}${API}-clang++
            export AR=$TOOLCHAIN/bin/llvm-ar
            export RANLIB=$TOOLCHAIN/bin/llvm-ranlib
            
            # zlib
            mkdir -p zlib-build-$arch && cd zlib-build-$arch
            ../zlib-1.2.13/configure --prefix=$GITHUB_WORKSPACE/deps/$arch --static
            make -j4 install && cd ..

            # libpng
            mkdir -p png-build-$arch && cd png-build-$arch
            export CPPFLAGS="-I$GITHUB_WORKSPACE/deps/$arch/include"
            export LDFLAGS="-L$GITHUB_WORKSPACE/deps/$arch/lib"
            ../libpng-1.6.40/configure --host=$arch --prefix=$GITHUB_WORKSPACE/deps/$arch CC=$CC AR=$AR RANLIB=$RANLIB --disable-shared --enable-static
            make -j4 install && cd ..

            # graphite2
            mkdir -p graphite2-build-$arch && cd graphite2-build-$arch
            cmake ../graphite2-1.3.14 \
              -DCMAKE_TOOLCHAIN_FILE=$NDK/build/cmake/android.toolchain.cmake \
              -DANDROID_ABI=$abi \
              -DANDROID_PLATFORM=android-$API \
              -DCMAKE_INSTALL_PREFIX=$GITHUB_WORKSPACE/deps/$arch \
              -DBUILD_SHARED_LIBS=OFF \
              -DCMAKE_POSITION_INDEPENDENT_CODE=ON
            cmake --build . --target graphite2-stat -j4
            cmake --install . --component graphite2-stat && cd ..

            # freetype
            mkdir -p freetype-build-$arch && cd freetype-build-$arch
            ../freetype-2.13.2/configure --host=$arch --prefix=$GITHUB_WORKSPACE/deps/$arch CC=$CC AR=$AR RANLIB=$RANLIB --disable-shared --enable-static
            make -j4 install && cd ..

            # harfbuzz
            mkdir -p hb-build-$arch && cd hb-build-$arch
            cmake ../harfbuzz-8.3.0 \
              -DCMAKE_TOOLCHAIN_FILE=$NDK/build/cmake/android.toolchain.cmake \
              -DANDROID_ABI=$abi \
              -DANDROID_PLATFORM=android-$API \
              -DCMAKE_INSTALL_PREFIX=$GITHUB_WORKSPACE/deps/$arch \
              -DBUILD_SHARED_LIBS=OFF \
              -Dharfbuzz_with_cairo=OFF -Dharfbuzz_with_chafa=OFF -Dharfbuzz_with_glib=OFF -Dharfbuzz_with_gobject=OFF -Dharfbuzz_with_icu=OFF -Dharfbuzz_with_tests=OFF -Dharfbuzz_with_utilities=OFF
            cmake --build . -j4 && cmake --install . && cd ..

            # --- BULLETPROOF PKG-CONFIG ECHO WRITERS ---
            PKG_DIR="$GITHUB_WORKSPACE/deps/$arch/lib/pkgconfig"
            mkdir -p "$PKG_DIR"
            
            echo "prefix=$GITHUB_WORKSPACE/deps/$arch" > "$PKG_DIR/zlib.pc"
            echo "exec_prefix=\${prefix}" >> "$PKG_DIR/zlib.pc"
            echo "libdir=\${exec_prefix}/lib" >> "$PKG_DIR/zlib.pc"
            echo "includedir=\${prefix}/include" >> "$PKG_DIR/zlib.pc"
            echo "Name: zlib" >> "$PKG_DIR/zlib.pc"
            echo "Description: zlib compression library" >> "$PKG_DIR/zlib.pc"
            echo "Version: 1.2.13" >> "$PKG_DIR/zlib.pc"
            echo "Libs: -L\${libdir} -lz" >> "$PKG_DIR/zlib.pc"
            echo "Cflags: -I\${includedir}" >> "$PKG_DIR/zlib.pc"

            echo "prefix=$GITHUB_WORKSPACE/deps/$arch" > "$PKG_DIR/libpng.pc"
            echo "exec_prefix=\${prefix}" >> "$PKG_DIR/libpng.pc"
            echo "libdir=\${exec_prefix}/lib" >> "$PKG_DIR/libpng.pc"
            echo "includedir=\${prefix}/include" >> "$PKG_DIR/libpng.pc"
            echo "Name: libpng" >> "$PKG_DIR/libpng.pc"
            echo "Description: Loads and saves PNG files" >> "$PKG_DIR/libpng.pc"
            echo "Version: 1.6.40" >> "$PKG_DIR/libpng.pc"
            echo "Libs: -L\${libdir} -lpng16 -lz" >> "$PKG_DIR/libpng.pc"
            echo "Cflags: -I\${includedir}" >> "$PKG_DIR/libpng.pc"

            echo "prefix=$GITHUB_WORKSPACE/deps/$arch" > "$PKG_DIR/freetype2.pc"
            echo "exec_prefix=\${prefix}" >> "$PKG_DIR/freetype2.pc"
            echo "libdir=\${exec_prefix}/lib" >> "$PKG_DIR/freetype2.pc"
            echo "includedir=\${prefix}/include" >> "$PKG_DIR/freetype2.pc"
            echo "Name: FreeType 2" >> "$PKG_DIR/freetype2.pc"
            echo "Description: FreeType font engine" >> "$PKG_DIR/freetype2.pc"
            echo "Version: 2.13.2" >> "$PKG_DIR/freetype2.pc"
            echo "Libs: -L\${libdir} -lfreetype" >> "$PKG_DIR/freetype2.pc"
            echo "Cflags: -I\${includedir}/freetype2" >> "$PKG_DIR/freetype2.pc"

            echo "prefix=$GITHUB_WORKSPACE/deps/$arch" > "$PKG_DIR/graphite2.pc"
            echo "exec_prefix=\${prefix}" >> "$PKG_DIR/graphite2.pc"
            echo "libdir=\${exec_prefix}/lib" >> "$PKG_DIR/graphite2.pc"
            echo "includedir=\${prefix}/include" >> "$PKG_DIR/graphite2.pc"
            echo "Name: graphite2" >> "$PKG_DIR/graphite2.pc"
            echo "Description: Graphite2 rendering library" >> "$PKG_DIR/graphite2.pc"
            echo "Version: 1.3.14" >> "$PKG_DIR/graphite2.pc"
            echo "Libs: -L\${libdir} -lgraphite2 -lstdc++" >> "$PKG_DIR/graphite2.pc"
            echo "Cflags: -I\${includedir}" >> "$PKG_DIR/graphite2.pc"

            echo "prefix=$GITHUB_WORKSPACE/deps/$arch" > "$PKG_DIR/harfbuzz.pc"
            echo "exec_prefix=\${prefix}" >> "$PKG_DIR/harfbuzz.pc"
            echo "libdir=\${exec_prefix}/lib" >> "$PKG_DIR/harfbuzz.pc"
            echo "includedir=\${prefix}/include" >> "$PKG_DIR/harfbuzz.pc"
            echo "Name: HarfBuzz" >> "$PKG_DIR/harfbuzz.pc"
            echo "Description: HarfBuzz text shaping library" >> "$PKG_DIR/harfbuzz.pc"
            echo "Version: 8.3.0" >> "$PKG_DIR/harfbuzz.pc"
            echo "Libs: -L\${libdir} -lharfbuzz" >> "$PKG_DIR/harfbuzz.pc"
            echo "Cflags: -I\${includedir}/harfbuzz" >> "$PKG_DIR/harfbuzz.pc"
          done

      - name: Build Tectonic JNI (Rust)
        env:
          CARGO_BUILD_JOBS: "2"
          PKG_CONFIG_ALLOW_CROSS: "1"
          TECTONIC_DEP_BACKEND: "pkg-config"
          PKG_CONFIG_PATH_aarch64_linux_android: "${{ github.workspace }}/deps/aarch64-linux-android/lib/pkgconfig"
          PKG_CONFIG_PATH_armv7_linux_androideabi: "${{ github.workspace }}/deps/armv7a-linux-androideabi/lib/pkgconfig"
          PKG_CONFIG_PATH_x86_64_linux_android: "${{ github.workspace }}/deps/x86_64-linux-android/lib/pkgconfig"
          PKG_CONFIG_PATH_i686_linux_android: "${{ github.workspace }}/deps/i686-linux-android/lib/pkgconfig"
        run: |
          cd app/src/main/rust/tectonic-jni
          cargo ndk -t arm64-v8a -t armeabi-v7a -t x86_64 -t x86 -o ../../../libs build --release

      - name: Generate Gradle Wrapper (Cloud Execution)
        run: gradle wrapper

      - name: Generate Debug Keystore Dynamically
        run: |
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "C=US, O=Android, CN=Android Debug"

      - name: Grant Execute Permissions
        run: chmod +x gradlew || true

      - name: Assemble Debug APK with Gradle
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload DocMorph APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DocMorph-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
